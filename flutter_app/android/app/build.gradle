plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.5.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

def hasKeystore = keystoreProperties.containsKey('storeFile') &&
    file(keystoreProperties['storeFile']).exists()

android {
    namespace = "com.nxg.openclawproot"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.nxg.openclawproot"
        minSdk = 29
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // StockClaw fork: armeabi-v7a removed. Node 24 (required by the OpenClaw
        // plugin SDK, >= 24.16) ships no linux-armv7l build, so
        // scripts/fetch-proot-binaries.sh no longer produces
        // jniLibs/armeabi-v7a - and the universal APK / AAB would otherwise
        // carry an ABI slice with no proot libraries, which installs on a 32-bit
        // device and then fails during setup.
        //
        // Do NOT express this as `ndk { abiFilters ... }`: Gradle rejects it with
        //   "Conflicting configuration : ... in ndk abiFilters cannot be present
        //    when splits abi filters are set"
        // because `flutter build apk --split-per-abi` sets splits.abi.filters.
        // The supported mechanism is Flutter's --target-platform, which must be
        // passed at every build invocation that ships an APK/AAB. See
        // scripts/build-apk.sh, .github/workflows/flutter-build.yml and README.
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        release {
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.0'
    implementation 'org.tukaani:xz:1.9'
    implementation 'com.github.luben:zstd-jni:1.5.6-4@aar'
}

flutter {
    source = "../.."
}
